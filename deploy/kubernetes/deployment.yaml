apiVersion: apps/v1
kind: Deployment
metadata:
  name: shiioo
  namespace: shiioo
  labels:
    app.kubernetes.io/name: shiioo
    app.kubernetes.io/component: server
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: shiioo
  template:
    metadata:
      labels:
        app.kubernetes.io/name: shiioo
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8080"
        prometheus.io/path: "/metrics"
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        fsGroup: 1000
      containers:
        - name: shiioo
          image: ghcr.io/raskell-io/shiioo:latest
          imagePullPolicy: Always
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
          env:
            - name: SHIIOO_ENCRYPTION_KEY
              valueFrom:
                secretKeyRef:
                  name: shiioo-secrets
                  key: encryption-key
            - name: SHIIOO_DATA_DIR
              value: /data
            - name: SHIIOO_HOST
              value: "0.0.0.0"
            - name: SHIIOO_PORT
              value: "8080"
          envFrom:
            - configMapRef:
                name: shiioo-config
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 1000m
              memory: 1Gi
          livenessProbe:
            httpGet:
              path: /health/live
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /health/ready
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          volumeMounts:
            - name: data
              mountPath: /data
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: shiioo-data
      terminationGracePeriodSeconds: 30
