[workspace]
resolver = "3"
members = [
    "crates/shiioo-core",
    "crates/shiioo-store",
    "crates/shiioo-runtime",
    "crates/shiioo-api",
    "crates/shiioo-sim",
    "crates/shiioo-telegram",
    "crates/shiioo-rules",
    "crates/shiioo-providers",
    "crates/shiioo-intake",
    "crates/shiioo-secrets",
    "crates/shiioo-node",
    "crates/shiioo-mail",
    "crates/shiioo",
]

[workspace.package]
version = "0.0.1"
edition = "2024"
rust-version = "1.88"
authors = ["Raskell Contributors"]
license = "Apache-2.0"
repository = "https://github.com/raskell-io/shiioo"

[workspace.dependencies]
shiioo-core = { path = "crates/shiioo-core" }
shiioo-store = { path = "crates/shiioo-store", default-features = false }
shiioo-runtime = { path = "crates/shiioo-runtime" }
shiioo-api = { path = "crates/shiioo-api" }
shiioo-telegram = { path = "crates/shiioo-telegram" }
shiioo-rules = { path = "crates/shiioo-rules" }
shiioo-providers = { path = "crates/shiioo-providers" }
shiioo-intake = { path = "crates/shiioo-intake" }
shiioo-secrets = { path = "crates/shiioo-secrets" }
shiioo-node = { path = "crates/shiioo-node" }
shiioo-mail = { path = "crates/shiioo-mail" }

serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["float_roundtrip", "raw_value"] }
sha2 = "0.10"
hex = "0.4"
thiserror = "2"
uuid = { version = "1", features = ["v4", "serde"] }
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "multipart"] }
clap = { version = "4", features = ["derive", "env"] }
axum = "0.8"
futures-util = "0.3"
sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio", "tls-rustls", "postgres", "uuid", "migrate", "macros"] }
redb = "4"
tempfile = "3"
toml = "0.8"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
unwrap_used = "deny"
expect_used = "warn"
