version: "3.8"

services:
  shiioo:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: shiioo
    ports:
      - "8080:8080"
    volumes:
      - shiioo-data:/data
    environment:
      # Required: 32-byte encryption key for secrets
      - SHIIOO_ENCRYPTION_KEY=${SHIIOO_ENCRYPTION_KEY:?SHIIOO_ENCRYPTION_KEY is required}
      # Optional configuration
      - SHIIOO_LOG_JSON=true
      - SHIIOO_RATE_LIMIT_PER_SECOND=100
      - SHIIOO_RATE_LIMIT_BURST=200
      - RUST_LOG=shiioo=info,tower_http=info
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health/live"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    restart: unless-stopped

  # Optional: Prometheus for metrics collection
  prometheus:
    image: prom/prometheus:v2.48.0
    container_name: shiioo-prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--web.enable-lifecycle'
    depends_on:
      - shiioo
    profiles:
      - monitoring

  # Optional: Grafana for visualization
  grafana:
    image: grafana/grafana:10.2.0
    container_name: shiioo-grafana
    ports:
      - "3000:3000"
    volumes:
      - grafana-data:/var/lib/grafana
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=admin
      - GF_USERS_ALLOW_SIGN_UP=false
    depends_on:
      - prometheus
    profiles:
      - monitoring

volumes:
  shiioo-data:
  prometheus-data:
  grafana-data:
