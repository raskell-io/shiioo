<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#f4f2ec" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0f1316" media="(prefers-color-scheme: dark)">
<title>Shiioo</title>
<link rel="icon" id="favicon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%232c746b'/%3E%3Ctext x='16' y='23' font-family='system-ui,sans-serif' font-size='21' font-weight='700' text-anchor='middle' fill='white'%3Es%3C/text%3E%3C/svg%3E">
<link rel="preload" href="/ui/fonts/inter.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="/ui/app.css">
<script>
  // Before the first paint, so a dark theme never flashes light: the
  // chosen theme, or the system's ("follow the system" is the default).
  try {
    const t = localStorage.getItem("shiioo_theme");
    document.documentElement.dataset.theme = t === "light" || t === "dark" ? t : matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
  } catch (_) {}
</script>
</head>
<body>
<div class="desk">
  <nav id="rail" class="rail" aria-label="Desk"></nav>
  <div class="layer">
    <nav id="side" class="side" aria-label="Runs"></nav>
    <main id="app" class="main"></main>
  </div>
</div>
<div id="toasts" class="toasts" aria-live="polite"></div>
<script type="module" src="/ui/app.js"></script>
</body>
</html>
