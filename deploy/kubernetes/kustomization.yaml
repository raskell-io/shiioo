apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: shiioo

resources:
  - namespace.yaml
  - secret.yaml
  - configmap.yaml
  - pvc.yaml
  - deployment.yaml
  - service.yaml
  - ingress.yaml
  # Uncomment if using Prometheus Operator
  # - servicemonitor.yaml

commonLabels:
  app.kubernetes.io/name: shiioo
  app.kubernetes.io/version: "0.1.0"
  app.kubernetes.io/managed-by: kustomize
